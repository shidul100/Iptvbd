    top: 109px;

    background: #000;
    width: 100%;
}

.video-box {
    position: relative;
    width: 100%;
    background: #000;
}

video {

    width: 100%;
    height: auto;
    max-height: 55vh;

    background: #000;
}

.player-status {
    position: absolute;

    z-index: 5;

.live-badge {

    display: none;

}

.now-playing {
    padding: 10px 12px;
    background: #111;
    font-size: 14px;
    min-height: 42px;
}

/* ================= EXTERNAL PLAYER ================= */

.external-player-box {
    padding: 12px;
    background: #111;
    border-top: 1px solid #292929;
}

.external-player-title {
    font-size: 14px;
    margin-bottom: 10px;
    color: #ddd;
}

.external-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.external-btn {
    border: 0;
    border-radius: 7px;
    padding: 9px 12px;
    color: #fff;
    cursor: pointer;
    font-size: 13px;
}

.btn-open {
    background: #e50914;
}

.btn-copy {
    background: #333;
    border: 1px solid #555;
}

.btn-new {
    background: #175ddc;
}

.btn-intent {
    background: #087f5b;
}

.external-help {
    color: #999;
    font-size: 11px;
    margin-top: 9px;
    line-height: 1.5;
}

/* ================= CHANNEL GRID ================= */

#channelGrid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 10px;
    padding: 12px;
}

.channel {
    min-width: 0;
    background: #151515;
    border-radius: 9px;
    padding: 7px;
    cursor: pointer;
    border: 1px solid #262626;
    transition: transform .15s, border-color .15s;
}

.channel:hover {
    transform: translateY(-2px);
    border-color: #e50914;
}

.channel.active {
    border-color: #e50914;
    box-shadow: 0 0 8px rgba(229,9,20,.35);
}

.channel-logo {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    background: #0d0d0d;
    border-radius: 6px;
    display: block;
}

.channel-name {
    font-size: 12px;
    text-align: center;
    margin-top: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.channel-group {
    color: #999;
    font-size: 10px;
    text-align: center;
    margin-top: 3px;
}

/* ================= LOADING / ERROR ================= */

#loading {
    text-align: center;
    padding: 30px;
    color: #aaa;
}

#error {
    display: none;
    text-align: center;
    padding: 25px;
    color: #ff6b6b;
}

/* ================= MOBILE ================= */

@media (max-width: 600px) {

    #channelGrid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 5px;
        padding: 6px;
    }

    .channel {
        padding: 4px;
        border-radius: 6px;
    }

    .channel-name {
        font-size: 9px;
        margin-top: 3px;
    }

    .channel-group {
        display: none;
    }

    .header-title {
        font-size: 18px;
    }

    .player-container {
        top: 104px;
    }

    video {
        max-height: 42vh;
        min-height: 180px;
    }

    .external-btn {
        font-size: 12px;
        padding: 8px 10px;
    }
}

/* ================= SMALL MOBILE ================= */

@media (max-width: 360px) {

    #channelGrid {
        gap: 4px;
        padding: 5px;
    }

    .channel-name {
        font-size: 8px;
    }

    video {
        min-height: 160px;
    }
}

/* =========================================================
   PLAYLIST
========================================================= */

const PLAYLIST_URL =
"https://raw.githubusercontent.com/shidul100/Iptv/refs/heads/main/playlist.m3u";


/* =========================================================
   ELEMENTS
========================================================= */

const video =
document.getElementById("videoPlayer");

const grid =
document.getElementById("channelGrid");

const search =
document.getElementById("search");

const loading =
document.getElementById("loading");

const errorBox =
document.getElementById("error");

const nowPlaying =
document.getElementById("nowPlaying");

const categoriesBox =
document.getElementById("categories");

const playerStatus =
document.getElementById("playerStatus");

const liveBadge =
document.getElementById("liveBadge");

const externalPlayerBox =
document.getElementById("externalPlayerBox");

const openDefaultBtn =
document.getElementById("openDefaultBtn");

const androidIntentBtn =
document.getElementById("androidIntentBtn");

const openNewTabBtn =
document.getElementById("openNewTabBtn");

const copyUrlBtn =
document.getElementById("copyUrlBtn");


/* =========================================================
   STATE
========================================================= */

let channels = [];

let currentCategory = "ALL";

let currentChannel = null;

let hls = null;

let mpegtsPlayer = null;

let retryTimer = null;

let retryCount = 0;

let currentExternalURL = "";

let playbackToken = 0;


/* =========================================================
   LOAD PLAYLIST
========================================================= */

async function loadPlaylist() {

    try {

        loading.style.display = "block";
        errorBox.style.display = "none";

        const response =
        await fetch(
            PLAYLIST_URL +
            "?t=" +
            Date.now(),
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {

            throw new Error(
                "Playlist HTTP " +
                response.status
            );
        }

        const text =
        await response.text();

        channels =
        parseM3U(text);

        loading.style.display = "none";

        if (!channels.length) {

            errorBox.innerText =
            "No channels found in playlist.";

            errorBox.style.display =
            "block";

            return;
        }

        createCategories();

        renderChannels();

    }

    catch (error) {

        console.error(
            "Playlist error:",
            error
        );

        loading.style.display =
        "none";

        errorBox.innerText =
        "Playlist load failed. Check playlist URL or CORS.";

        errorBox.style.display =
        "block";
    }
}


/* =========================================================
   M3U PARSER
========================================================= */

function parseM3U(text) {

    const lines =
    text
    .split(/\r?\n/)
    .map(
        line =>
        line.trim()
    )
    .filter(Boolean);

    const result = [];

    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
        lines[i];

        if (
            !line
            .toUpperCase()
            .startsWith("#EXTINF")
        ) {
            continue;
        }

        const info =
        line;

        let url = "";

        for (
            let j = i + 1;
            j < lines.length;
            j++
        ) {

            if (
                !lines[j].startsWith("#")
            ) {

                url =
                lines[j];

                break;
            }
        }

        if (!url) {
            continue;
        }

        let name =
        info.substring(
            info.lastIndexOf(",") + 1
        ).trim();

        if (!name) {
            name = "Unknown Channel";
        }

        const logoMatch =
        info.match(
            /tvg-logo="([^"]*)"/i
        );

        const groupMatch =
        info.match(
            /group-title="([^"]*)"/i
        );

        const idMatch =
        info.match(
            /tvg-id="([^"]*)"/i
        );

        result.push({

            name: name,

            logo:
            logoMatch
            ? logoMatch[1]
            : "",

            group:
            groupMatch && groupMatch[1]
            ? groupMatch[1]
            : "OTHER",

            id:
            idMatch
            ? idMatch[1]
            : "",

            url:
            url.trim()
        });
    }

    return result;
}


/* =========================================================
   CATEGORIES
========================================================= */

function createCategories() {

    const groups =
    [
        ...new Set(
            channels.map(
                channel =>
                channel.group ||
                "OTHER"
            )
        )
    ];

    categoriesBox.innerHTML = "";

    addCategoryButton("ALL");

    groups.forEach(
        group =>
        addCategoryButton(group)
    );
}


function addCategoryButton(category) {

    const button =
    document.createElement("button");

    button.className =
    "category-btn" +
    (
        category === "ALL"
        ? " active"
        : ""
    );

    button.textContent =
    category;

    button.type =
    "button";

    button.onclick =
    function() {

        currentCategory =
        category;

        document
        .querySelectorAll(
            ".category-btn"
        )
        .forEach(
            btn =>
            btn.classList.remove("active")
        );

        button.classList.add("active");

        renderChannels();
    };

    categoriesBox.appendChild(
        button
    );
}


/* =========================================================
   PLACEHOLDER LOGO
========================================================= */

function placeholderLogo(name) {

    const text =
    escapeSVG(
        name.substring(
            0,
            12
        )
    );

    const svg =
`
<svg xmlns="http://www.w3.org/2000/svg"
     width="300"
     height="300"
     viewBox="0 0 300 300">

    <rect
        width="300"
        height="300"
        fill="#111111"
    />

    <text
        x="150"
        y="150"
        text-anchor="middle"
        dominant-baseline="middle"
        fill="#ffffff"
        font-size="26"
        font-family="Arial"
    >
        ${text}
    </text>

</svg>
`;

    return (
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg)
    );
}


function escapeSVG(text) {

    return String(text)
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&apos;"
    );
}


/* =========================================================
   RENDER CHANNELS
========================================================= */

function renderChannels() {

    const keyword =
    search.value
    .toLowerCase()
    .trim();

    grid.innerHTML = "";

    const filtered =
    channels.filter(
        channel => {

            const categoryOK =
            currentCategory === "ALL" ||
            channel.group ===
            currentCategory;

            const searchOK =
            channel.name
            .toLowerCase()
            .includes(keyword);

            return (
                categoryOK &&
                searchOK
            );
        }
    );

    filtered.forEach(
        channel => {

            const card =
            document.createElement(
                "div"
            );

            card.className =
            "channel";

            if (
                currentChannel &&
                currentChannel.url ===
                channel.url
            ) {

                card.classList.add(
                    "active"
                );
            }

            const img =
            document.createElement(
                "img"
            );

            img.className =
            "channel-logo";

            img.loading =
            "lazy";

            img.alt =
            channel.name;

            img.src =
            channel.logo ||
            placeholderLogo(
                channel.name
            );

            img.onerror =
            function() {

                this.onerror =
                null;

                this.src =
                placeholderLogo(
                    channel.name
                );
            };

            const name =
            document.createElement(
                "div"
            );

            name.className =
            "channel-name";

            name.textContent =
            channel.name;

            const group =
            document.createElement(
                "div"
            );

            group.className =
            "channel-group";

            group.textContent =
            channel.group;

            card.appendChild(img);
            card.appendChild(name);
            card.appendChild(group);

            card.onclick =
            function() {

                playChannel(channel);

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            };

            grid.appendChild(card);
        }
    );
}


/* =========================================================
   DESTROY ALL PLAYERS
========================================================= */

function destroyPlayer() {

    playbackToken++;

    clearTimeout(
        retryTimer
    );

    retryTimer =
    null;

    retryCount =
    0;

    /* HLS */

    if (hls) {

        try {
            hls.stopLoad();
        }
        catch(e) {}

        try {
            hls.detachMedia();
        }
        catch(e) {}

        try {
            hls.destroy();
        }
        catch(e) {}

        hls =
        null;
    }


    /* MPEG-TS */

    if (mpegtsPlayer) {

        try {
            mpegtsPlayer.pause();
        }
        catch(e) {}

        try {
            mpegtsPlayer.unload();
        }
        catch(e) {}

        try {
            mpegtsPlayer.detachMediaElement();
        }
        catch(e) {}

        try {
            mpegtsPlayer.destroy();
        }
        catch(e) {}

        mpegtsPlayer =
        null;
    }


    try {
        video.pause();
    }
    catch(e) {}


    video.removeAttribute(
        "src"
    );

    video.load();


    currentExternalURL =
    "";

    playerStatus.style.display =
    "none";

    liveBadge.style.display =
    "none";

    externalPlayerBox.style.display =
    "none";
}


/* =========================================================
   STREAM TYPE
========================================================= */

function isHLS(url) {

    const lower =
    url.toLowerCase();

    return (
        lower.includes(".m3u8") ||
        lower.includes(
            "application/vnd.apple.mpegurl"
        )
    );
}


function isTS(url) {

    const clean =
    url
    .split("?")[0]
    .split("#")[0]
    .toLowerCase();

    return (
        clean.endsWith(".ts") ||
        clean.endsWith(".m2ts") ||
        clean.endsWith(".mts")
    );
}


/* =========================================================
   PLAY CHANNEL
========================================================= */

function playChannel(channel) {

    currentChannel =
    channel;

    clearTimeout(
        retryTimer
    );

    nowPlaying.innerHTML =
    "▶ " +
    escapeHTML(
        channel.name
    );

    renderChannels();

    destroyPlayer();

    const url =
    String(
        channel.url || ""
    ).trim();

    if (!url) {

        showPlayerError(
            "Invalid stream URL."
        );

        return;
    }

    console.log(
        "Playing channel:",
        channel.name
    );

    console.log(
        "Stream URL:",
        url
    );

    setStatus(
        "Connecting..."
    );


    /* HLS */

    if (
        isHLS(url)
    ) {

        playHLS(url);

        return;
    }


    /* MPEG-TS */

    if (
        isTS(url)
    ) {

        playTS(url);

        return;
    }


    /* Normal video */

    startNormalVideo(url);
}


/* =========================================================
   MPEG-TS PLAYER
========================================================= */

function playTS(url) {

    const token =
    playbackToken;

    setStatus(
        "Connecting TS stream..."
    );

    if (
        !window.mpegts
    ) {

        console.error(
            "mpegts.js is not loaded."
        );

        showExternalPlayer(url);

        return;
    }


    if (
        !mpegts.isSupported()
    ) {

        console.error(
            "mpegts.js is not supported."
        );

        showExternalPlayer(url);

        return;
    }


    try {

        mpegtsPlayer =
        mpegts.createPlayer(

            {
                type: "mpegts",

                url: url,

                isLive: true
            },

            {

                enableWorker: true,

                enableStashBuffer: false,

                stashInitialSize: 128,

                lazyLoad: false,

                seekType: "range",

                autoCleanupSourceBuffer: true,

                autoCleanupMaxBackwardDuration: 30,

                autoCleanupMinBackwardDuration: 15
            }
        );


        /* Attach */

        mpegtsPlayer.attachMediaElement(
            video
        );


        /* Media info */

        mpegtsPlayer.on(
            mpegts.Events.MEDIA_INFO,
            function(info) {

                console.log(
                    "MPEG-TS Media Info:",
                    info
                );
            }
        );


        /* Statistics */

        mpegtsPlayer.on(
            mpegts.Events.STATISTICS_INFO,
            function(info) {

                console.log(
                    "MPEG-TS Statistics:",
                    info
                );
            }
        );


        /* Error */

        mpegtsPlayer.on(
            mpegts.Events.ERROR,
            function(
                errorType,
                errorDetail,
                errorInfo
            ) {

                console.error(
                    "MPEG-TS ERROR:",
                    errorType,
                    errorDetail,
                    errorInfo
                );

                if (
                    token !==
                    playbackToken
                ) {
                    return;
                }

                setStatus(
                    "TS stream error..."
                );

                setTimeout(
                    function() {

                        if (
                            token ===
                            playbackToken
                        ) {

                            showExternalPlayer(
                                url
                            );
                        }

                    },
                    800
                );
            }
        );


        /* Load */

        mpegtsPlayer.load();


        /* Play */

        mpegtsPlayer.play()
        .then(
            function() {

                if (
                    token !==
                    playbackToken
                ) {
                    return;
                }

                console.log(
                    "MPEG-TS playback started."
                );

                setStatus("");

                liveBadge.style.display =
                "block";
            }
        )
        .catch(
            function(error) {

                console.error(
                    "MPEG-TS play error:",
                    error
                );

                if (
                    token ===
                    playbackToken
                ) {

                    showExternalPlayer(
                        url
                    );
                }
            }
        );

    }

    catch(error) {

        console.error(
            "MPEG-TS initialization error:",
            error
        );

        showExternalPlayer(
            url
        );
    }
}


/* =========================================================
   HLS
========================================================= */

function playHLS(url) {

    setStatus(
        "Connecting HLS..."
    );


    /* Native HLS */

    if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        startNativeHLS(url);

        return;
    }


    /* HLS.js */

    if (
        window.Hls &&
        Hls.isSupported()
    ) {

        startHLS(url);

        return;
    }


    showPlayerError(
        "HLS is not supported by this browser."
    );
}


/* =========================================================
   NATIVE HLS
========================================================= */

function startNativeHLS(url) {

    const token =
    playbackToken;

    video.src =
    url;

    video.load();


    const onMetadata =
    function() {

        video.removeEventListener(
            "loadedmetadata",
            onMetadata
        );

        if (
            token !==
            playbackToken
        ) {
            return;
        }

        setStatus("");

        liveBadge.style.display =
        "block";

        video.play()
        .catch(
            function(error) {

                console.warn(
                    "Native HLS autoplay:",
                    error
                );

                setStatus(
                    "Tap ▶ to play"
                );
            }
        );
    };


    video.addEventListener(
        "loadedmetadata",
        onMetadata
    );


    video.addEventListener(
        "error",
        function() {

            if (
                token !==
                playbackToken
            ) {
                return;
            }

            showPlayerError(
                "Unable to play HLS stream."
            );
        },
        {
            once: true
        }
    );
}


/* =========================================================
   HLS.JS
========================================================= */

function startHLS(url) {

    const token =
    playbackToken;

    hls =
    new Hls({

        enableWorker: true,

        lowLatencyMode: true,

        backBufferLength: 30,

        maxBufferLength: 30,

        maxMaxBufferLength: 60,

        startLevel: -1,

        capLevelToPlayerSize: true,

        liveSyncDurationCount: 3,

        liveMaxLatencyDurationCount: 6,

        manifestLoadingMaxRetry: 3,

        levelLoadingMaxRetry: 3,

        fragLoadingMaxRetry: 3,

        manifestLoadingRetryDelay: 1000,

        levelLoadingRetryDelay: 1000,

        fragLoadingRetryDelay: 1000
    });


    hls.loadSource(
        url
    );

    hls.attachMedia(
        video
    );


    hls.on(
        Hls.Events.MANIFEST_PARSED,
        function() {

            if (
                token !==
                playbackToken
            ) {
                return;
            }

            setStatus("");

            liveBadge.style.display =
            "block";

            video.play()
            .catch(
                function(error) {

                    console.warn(
                        "HLS autoplay:",
                        error
                    );

                    setStatus(
                        "Tap ▶ to play"
                    );
                }
            );
        }
    );


    hls.on(
        Hls.Events.ERROR,
        function(
            event,
            data
        ) {

            if (
                token !==
                playbackToken
            ) {
                return;
            }

            console.warn(
                "HLS error:",
                data
            );

            if (
                !data.fatal
            ) {
                return;
            }


            /* Media error */

            if (
                data.type ===
                Hls.ErrorTypes.MEDIA_ERROR
            ) {

                try {

                    hls.recoverMediaError();

                    return;

                }

                catch(error) {

                    console.warn(
                        "HLS recovery failed:",
                        error
                    );
                }
            }


            /* Network / other fatal error */

            retryHLS(url);
        }
    );
}


/* =========================================================
   HLS RETRY
========================================================= */

function retryHLS(url) {

    if (
        retryCount >= 5
    ) {

        showExternalPlayer(
            url
        );

        return;
    }

    retryCount++;

    setStatus(
        "Reconnecting " +
        retryCount +
        "/5..."
    );

    clearTimeout(
        retryTimer
    );


    const token =
    playbackToken;


    retryTimer =
    setTimeout(
        function() {

            if (
                token !==
                playbackToken ||
                !hls
            ) {
                return;
            }

            try {

                hls.stopLoad();

                hls.loadSource(
                    url
                );

                hls.startLoad();

            }

            catch(error) {

                console.warn(
                    "HLS retry error:",
                    error
                );

                retryHLS(url);
            }

        },
        Math.min(
            retryCount * 1000,
            5000
        )
    );
}


/* =========================================================
   NORMAL VIDEO
========================================================= */

function startNormalVideo(url) {

    const token =
    playbackToken;

    video.src =
    url;

    video.load();

    video.play()
    .then(
        function() {

            if (
                token !==
                playbackToken
            ) {
                return;
            }

            setStatus("");

            liveBadge.style.display =
            "block";
        }
    )
    .catch(
        function(error) {

            console.warn(
                "Normal video error:",
                error
            );

            if (
                token ===
                playbackToken
            ) {

                showExternalPlayer(
                    url
                );
            }
        }
    );
}


/* =========================================================
   EXTERNAL PLAYER
========================================================= */

function showExternalPlayer(url) {

    currentExternalURL =
    url;

    setStatus("");

    liveBadge.style.display =
    "none";

    externalPlayerBox.style.display =
    "block";

    nowPlaying.innerHTML =
    "⚠️ " +
    escapeHTML(
        currentChannel
        ? currentChannel.name
        : "Stream"
    );
}


/* =========================================================
   OPEN PLAYER
========================================================= */

openDefaultBtn.onclick =
function() {

    if (
        !currentExternalURL
    ) {
        return;
    }

    openExternalURL(
        currentExternalURL
    );
};


/* =========================================================
   ANDROID PLAYER
========================================================= */

androidIntentBtn.onclick =
function() {

    if (
        !currentExternalURL
    ) {
        return;
    }

    openAndroidIntent(
        currentExternalURL
    );
};


/* =========================================================
   OPEN URL
========================================================= */

openNewTabBtn.onclick =
function() {

    if (
        !currentExternalURL
    ) {
        return;
    }

    window.open(
        currentExternalURL,
        "_blank",
        "noopener,noreferrer"
    );
};


/* =========================================================
   COPY URL
========================================================= */

copyUrlBtn.onclick =
async function() {

    if (
        !currentExternalURL
    ) {
        return;
    }

    try {

        await navigator.clipboard.writeText(
            currentExternalURL
        );

        copyUrlBtn.innerText =
        "✓ Copied";

        setTimeout(
            function() {

                copyUrlBtn.innerText =
                "📋 Copy URL";

            },
            2000
        );

    }

    catch(error) {

        prompt(
            "Copy stream URL:",
            currentExternalURL
        );
    }
};


/* =========================================================
   OPEN EXTERNAL URL
========================================================= */

function openExternalURL(url) {

    const link =
    document.createElement(
        "a"
    );

    link.href =
    url;

    link.target =
    "_blank";

    link.rel =
    "noopener noreferrer";

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();
}


/* =========================================================
   ANDROID INTENT
========================================================= */

function openAndroidIntent(url) {

    try {

        const parsed =
        new URL(url);

        const scheme =
        parsed.protocol.replace(
            ":",
            ""
        );

        const intentURL =
        "intent://" +

        url.replace(
            /^https?:\/\//i,
            ""
        ) +

        "#Intent;" +

        "scheme=" +
        scheme +
        ";" +

        "action=android.intent.action.VIEW;" +

        "type=video/*;" +

        "end";


        window.location.href =
        intentURL;

    }

    catch(error) {

        console.warn(
            "Android intent error:",
            error
        );

        openExternalURL(url);
    }
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(message) {

    if (!message) {

        playerStatus.style.display =
        "none";

        return;
    }

    playerStatus.innerText =
    message;

    playerStatus.style.display =
    "block";
}


/* =========================================================
   PLAYER ERROR
========================================================= */

function showPlayerError(message) {

    setStatus("");

    liveBadge.style.display =
    "none";

    nowPlaying.innerHTML =
    "⚠️ " +
    escapeHTML(
        message
    );
}


/* =========================================================
   SEARCH
========================================================= */

search.addEventListener(
    "input",
    function() {

        renderChannels();
    }
);


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(text) {

    return String(text)

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );
}


/* =========================================================
   VIDEO EVENTS
========================================================= */

video.addEventListener(
    "loadstart",
    function() {

        setStatus(
            "Loading..."
        );
    }
);


video.addEventListener(
    "waiting",
    function() {

        setStatus(
            "⏳ Buffering..."
        );
    }
);


video.addEventListener(
    "playing",
    function() {

        setStatus("");

        liveBadge.style.display =
        "block";

        if (
            currentChannel
        ) {

            nowPlaying.innerHTML =
            "▶ " +
            escapeHTML(
                currentChannel.name
            );
        }
    }
);


video.addEventListener(
    "canplay",
    function() {

        setStatus("");
    }
);


video.addEventListener(
    "stalled",
    function() {

        setStatus(
            "⚠️ Stream stalled..."
        );
    }
);


video.addEventListener(
    "ended",
    function() {

        setStatus(
            "Stream ended"
        );
    }
);


/* =========================================================
   VISIBILITY RECOVERY
========================================================= */

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.hidden
        ) {
            return;
        }


        if (
            hls &&
            !video.paused
        ) {

            try {

                hls.startLoad();

            }

            catch(error) {}
        }


        if (
            mpegtsPlayer &&
            !video.paused
        ) {

            try {

                mpegtsPlayer.play();

            }

            catch(error) {}
        }
    }
);


/* =========================================================
   START APP
========================================================= */

loadPlaylist();
